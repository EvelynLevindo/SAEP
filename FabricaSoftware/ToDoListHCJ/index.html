<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Dia - Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Meu Dia</h1>
        </header>

        <section class="input-section">
            <input 
                type="text" 
                id="task-input" 
                placeholder="O que você planeja fazer hoje?" 
                autocomplete="off"
            >
            <button id="add-btn" type="button">Adicionar</button>
        </section>

        <section class="list-section">
            <ul id="task-list"></ul>
            <p id="empty-message" class="empty-message">Nenhuma tarefa por enquanto. Adicione uma acima!</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
